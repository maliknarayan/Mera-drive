name: sangamdrive

# Run from the repository root:
#   docker compose -f docker/docker-compose.yml up -d --build

services:
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    image: sangamdrive/api:${VERSION:-dev}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      API_PORT: 8080
      SQLITE_PATH: /data/sangamdrive.db
    volumes:
      - api-data:/data
    ports:
      # remove this once a reverse proxy fronts the API
      - '127.0.0.1:8080:8080'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    image: sangamdrive/web:${VERSION:-dev}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    security_opt:
      - no-new-privileges:true

volumes:
  api-data:
